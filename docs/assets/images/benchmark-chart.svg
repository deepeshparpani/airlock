<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <rect width="800" height="320" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="35" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#0f172a">
    Agent PreToolUse Hook Cold-Start Latency (macOS Apple Silicon)
  </text>
  <text x="35" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">
    Full process lifetime per command interception
  </text>

  <!-- Metric 1: Python Hook -->
  <g transform="translate(35, 90)">
    <text x="0" y="15" font-family="sans-serif" font-size="13" font-weight="600" fill="#475569">Python Engine (`airlock_hook.py`)</text>
    <rect x="0" y="24" width="600" height="32" rx="6" fill="#f1f5f9"/>
    <rect x="0" y="24" width="580" height="32" rx="6" fill="#94a3b8"/>
    <text x="590" y="45" font-family="monospace" font-size="13" font-weight="700" fill="#334155">~41.2 ms</text>
    <text x="12" y="45" font-family="sans-serif" font-size="11" font-weight="600" fill="#ffffff">Baseline Python Interpreter</text>
  </g>

  <!-- Metric 2: Rust Native Hook -->
  <g transform="translate(35, 170)">
    <text x="0" y="15" font-family="sans-serif" font-size="13" font-weight="700" fill="#065f46">Rust Native Binary (`airlock-hook` / `airlock`)</text>
    <rect x="0" y="24" width="600" height="32" rx="6" fill="#f1f5f9"/>
    <rect x="0" y="24" width="55" height="32" rx="6" fill="#059669"/>
    <text x="68" y="45" font-family="monospace" font-size="14" font-weight="800" fill="#047857">~3.8 ms (10.8x FASTER)</text>
    <text x="320" y="45" font-family="monospace" font-size="11" font-weight="600" fill="#059669">Zero GC • ~2 MB RSS</text>
  </g>

  <!-- Metric 3: Internal Tier 0 Check -->
  <g transform="translate(35, 250)">
    <text x="0" y="14" font-family="sans-serif" font-size="12" font-weight="600" fill="#0284c7">Tier 0 Invariant Rule Evaluation Time</text>
    <rect x="0" y="20" width="600" height="22" rx="4" fill="#f1f5f9"/>
    <rect x="0" y="20" width="12" height="22" rx="4" fill="#0284c7"/>
    <text x="22" y="36" font-family="monospace" font-size="12" font-weight="700" fill="#0369a1">&lt; 0.01 ms (&lt; 10 µs)</text>
    <text x="180" y="36" font-family="sans-serif" font-size="11" fill="#64748b">Instant zero-allocation compiled regex &amp; AST path matching</text>
  </g>
</svg>
