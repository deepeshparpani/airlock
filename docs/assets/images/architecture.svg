<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="480" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Title Pill -->
  <rect x="375" y="20" width="250" height="30" rx="15" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="500" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="0.5">
    CASCADED EXECUTION PIPELINE
  </text>

  <!-- Step 1: Agent Tool Request -->
  <g transform="translate(35, 75)" filter="url(#shadow)">
    <rect width="210" height="135" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="15" y="15" width="28" height="28" rx="6" fill="#eff6ff"/>
    <text x="29" y="34" font-family="sans-serif" font-size="14" font-weight="800" fill="#2563eb" text-anchor="middle">⚡</text>
    <text x="52" y="34" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f172a">AI Tool Request</text>
    <text x="16" y="65" font-family="monospace" font-size="11" fill="#475569">• Google Antigravity</text>
    <text x="16" y="83" font-family="monospace" font-size="11" fill="#475569">• Claude Code / Cursor</text>
    <text x="16" y="101" font-family="monospace" font-size="11" fill="#475569">• Universal airlock exec</text>
    <rect x="16" y="112" width="178" height="16" rx="3" fill="#f1f5f9"/>
    <text x="105" y="124" font-family="monospace" font-size="9" font-weight="600" fill="#64748b" text-anchor="middle">PreToolUse Hook Gate</text>
  </g>

  <!-- Connector 1 -->
  <path d="M 245 142 L 305 142" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="305,138 313,142 305,146" fill="#94a3b8"/>

  <!-- Step 2: Tier 0 Deterministic Engine -->
  <g transform="translate(315, 65)" filter="url(#shadow)">
    <rect width="370" height="155" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <rect x="18" y="16" width="30" height="30" rx="6" fill="#ecfdf5"/>
    <text x="33" y="36" font-family="sans-serif" font-size="14" font-weight="800" fill="#059669" text-anchor="middle">🛡️</text>
    <text x="56" y="36" font-family="sans-serif" font-size="15" font-weight="800" fill="#0f172a">Tier 0: Deterministic Core</text>
    <rect x="295" y="21" width="58" height="20" rx="10" fill="#d1fae5"/>
    <text x="324" y="35" font-family="monospace" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">&lt; 10 µs</text>

    <text x="18" y="68" font-family="sans-serif" font-size="12" fill="#334155">• Pure Rust zero-allocation regex &amp; AST path matching</text>
    <text x="18" y="88" font-family="sans-serif" font-size="12" fill="#334155">• Prompt injection &amp; model control breakout rejection</text>
    <text x="18" y="108" font-family="sans-serif" font-size="12" fill="#334155">• Hard blocks: ~/.ssh, ~/.aws, .env, keychains, chat.db</text>
    <text x="18" y="128" font-family="sans-serif" font-size="12" fill="#334155">• Build cleanup allowlist (dist, build, target, node_modules)</text>
    <text x="18" y="148" font-family="sans-serif" font-size="12" fill="#334155">• Diagnostic env scrubbing allowed (env -u / --unset)</text>
  </g>

  <!-- Output A: Fast Allow -->
  <path d="M 685 110 L 780 110" fill="none" stroke="#059669" stroke-width="2"/>
  <polygon points="780,106 788,110 780,114" fill="#059669"/>
  <g transform="translate(790, 80)" filter="url(#shadow)">
    <rect width="175" height="60" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="87" y="26" font-family="sans-serif" font-size="12" font-weight="800" fill="#065f46" text-anchor="middle">✔ FAST ALLOW</text>
    <text x="87" y="44" font-family="monospace" font-size="10" fill="#047857" text-anchor="middle">&lt; 1 ms • ls, git, cargo test</text>
  </g>

  <!-- Output B: Hard Deny -->
  <path d="M 685 170 L 780 170" fill="none" stroke="#dc2626" stroke-width="2"/>
  <polygon points="780,166 788,170 780,174" fill="#dc2626"/>
  <g transform="translate(790, 148)" filter="url(#shadow)">
    <rect width="175" height="60" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
    <text x="87" y="26" font-family="sans-serif" font-size="12" font-weight="800" fill="#991b1b" text-anchor="middle">✖ HARD DENY</text>
    <text x="87" y="44" font-family="monospace" font-size="10" fill="#b91c1c" text-anchor="middle">Immediate • rm -rf /, exfil</text>
  </g>

  <!-- Path Down: Ambiguous Escalation -->
  <path d="M 500 220 L 500 270" fill="none" stroke="#d97706" stroke-width="2"/>
  <polygon points="496,270 500,278 504,270" fill="#d97706"/>
  <rect x="510" y="235" width="115" height="18" rx="4" fill="#fef3c7"/>
  <text x="567" y="248" font-family="sans-serif" font-size="10" font-weight="600" fill="#92400e" text-anchor="middle">Ambiguous Mutation</text>

  <!-- Step 3: Stage 1 Fast SLM -->
  <g transform="translate(315, 280)" filter="url(#shadow)">
    <rect width="370" height="85" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="18" y="14" width="28" height="28" rx="6" fill="#fffbeb"/>
    <text x="32" y="33" font-family="sans-serif" font-size="14" font-weight="800" fill="#d97706" text-anchor="middle">🧠</text>
    <text x="54" y="33" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f172a">Stage 1: Semantic SLM (~2.5s)</text>
    <text x="18" y="56" font-family="sans-serif" font-size="11" fill="#475569">• Schema-enforced Gemini Flash-Low over warm IPC daemon</text>
    <text x="18" y="72" font-family="sans-serif" font-size="11" fill="#475569">• Confidence scoring: High -&gt; Short-circuit | Low -&gt; Stage 2</text>
  </g>

  <!-- Output C: Stage 1 Verdict -->
  <path d="M 685 322 L 780 322" fill="none" stroke="#059669" stroke-width="2"/>
  <polygon points="780,318 788,322 780,326" fill="#059669"/>
  <g transform="translate(790, 298)" filter="url(#shadow)">
    <rect width="175" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="87" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">Stage 1 Allow/Deny</text>
    <text x="87" y="39" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">High Confidence</text>
  </g>

  <!-- Path Down to Stage 2 -->
  <path d="M 500 365 L 500 395" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <polygon points="496,395 500,402 504,395" fill="#7c3aed"/>

  <!-- Step 4: Stage 2 Deep Deliberation -->
  <g transform="translate(315, 405)" filter="url(#shadow)">
    <rect width="370" height="60" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="18" y="28" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Stage 2: Deep Review Escalation (&lt;10s)</text>
    <text x="18" y="47" font-family="sans-serif" font-size="11" fill="#475569">• Multi-model deliberative review with fail-closed guarantee</text>
  </g>

  <!-- Output D: Stage 2 Verdict -->
  <path d="M 685 435 L 780 435" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <polygon points="780,431 788,435 780,439" fill="#7c3aed"/>
  <g transform="translate(790, 410)" filter="url(#shadow)">
    <rect width="175" height="50" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/>
    <text x="87" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#6d28d9" text-anchor="middle">Stage 2 Verdict</text>
    <text x="87" y="39" font-family="monospace" font-size="10" fill="#7c3aed" text-anchor="middle">Fail-Closed Boundary</text>
  </g>
</svg>
