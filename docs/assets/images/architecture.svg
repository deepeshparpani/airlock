<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGradTier0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#131d31"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="520" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="520"/>
    <line x1="250" y1="0" x2="250" y2="520"/>
    <line x1="400" y1="0" x2="400" y2="520"/>
    <line x1="550" y1="0" x2="550" y2="520"/>
    <line x1="700" y1="0" x2="700" y2="520"/>
    <line x1="850" y1="0" x2="850" y2="520"/>
    <line x1="0" y1="80" x2="1000" y2="80"/>
    <line x1="0" y1="180" x2="1000" y2="180"/>
    <line x1="0" y1="280" x2="1000" y2="280"/>
    <line x1="0" y1="380" x2="1000" y2="380"/>
  </g>

  <!-- Title Badge -->
  <rect x="360" y="24" width="280" height="34" rx="17" fill="#1e293b" stroke="#334155"/>
  <text x="500" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1">
    AIRLOCK CASCADED PIPELINE
  </text>

  <!-- Node 1: AI Agent Tool Request -->
  <g transform="translate(40, 80)">
    <rect width="210" height="140" rx="12" fill="url(#cardGrad1)" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="8" fill="#3b82f6"/>
    <text x="46" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#f8fafc">AI Agent Tool Call</text>
    <text x="20" y="60" font-family="monospace" font-size="11" fill="#94a3b8">• Google Antigravity</text>
    <text x="20" y="78" font-family="monospace" font-size="11" fill="#94a3b8">• Claude Code / Cursor</text>
    <text x="20" y="96" font-family="monospace" font-size="11" fill="#94a3b8">• CI/CD / OpenHands</text>
    <rect x="20" y="112" width="170" height="18" rx="4" fill="#0284c7" opacity="0.2"/>
    <text x="105" y="125" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">PreToolUse Hook / exec</text>
  </g>

  <!-- Connector 1 -->
  <path d="M 250 150 L 310 150" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <polygon points="310,146 318,150 310,154" fill="#60a5fa" />

  <!-- Node 2: Tier 0 Deterministic Engine -->
  <g transform="translate(320, 80)">
    <rect width="360" height="160" rx="14" fill="url(#cardGradTier0)" stroke="#10b981" stroke-width="2" filter="url(#glow)" opacity="0.15"/>
    <rect width="360" height="160" rx="14" fill="url(#cardGradTier0)" stroke="#10b981" stroke-width="2"/>
    <circle cx="30" cy="30" r="10" fill="#10b981"/>
    <text x="50" y="34" font-family="sans-serif" font-size="16" font-weight="800" fill="#f8fafc">TIER 0: Deterministic Engine</text>
    <rect x="280" y="20" width="66" height="20" rx="10" fill="#065f46"/>
    <text x="313" y="34" font-family="monospace" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">&lt; 1 ms</text>

    <text x="24" y="65" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Pure Rust AST &amp; zero-allocation regex check</text>
    <text x="24" y="85" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Microsecond adversarial prompt injection scanner</text>
    <text x="24" y="105" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Strict path boundaries: blocks ~/.ssh, ~/.aws, chat.db</text>
    <text x="24" y="125" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Safe build target allowlist (dist, target, build)</text>
    <text x="24" y="145" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Bidirectional high-entropy credential redactor</text>
  </g>

  <!-- Path A: Tier 0 Fast Allow (Top Right) -->
  <path d="M 680 120 L 780 120" fill="none" stroke="#10b981" stroke-width="2.5"/>
  <polygon points="780,116 788,120 780,124" fill="#10b981" />
  
  <g transform="translate(790, 85)">
    <rect width="170" height="70" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="85" y="28" font-family="sans-serif" font-size="13" font-weight="800" fill="#34d399" text-anchor="middle">✔ FAST ALLOW</text>
    <text x="85" y="48" font-family="monospace" font-size="10" fill="#a7f3d0" text-anchor="middle">0.04 ms (sub-1ms)</text>
    <text x="85" y="62" font-family="sans-serif" font-size="10" fill="#6ee7b7" text-anchor="middle">ls, git, cargo test, pestat</text>
  </g>

  <!-- Path B: Tier 0 Hard Deny (Middle Right) -->
  <path d="M 680 180 L 780 180" fill="none" stroke="#ef4444" stroke-width="2.5"/>
  <polygon points="780,176 788,180 780,184" fill="#ef4444" />

  <g transform="translate(790, 160)">
    <rect width="170" height="70" rx="10" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
    <text x="85" y="28" font-family="sans-serif" font-size="13" font-weight="800" fill="#fca5a5" text-anchor="middle">✖ HARD DENY</text>
    <text x="85" y="48" font-family="monospace" font-size="10" fill="#fecaca" text-anchor="middle">&lt; 0.05 ms (Immediate)</text>
    <text x="85" y="62" font-family="sans-serif" font-size="10" fill="#f87171" text-anchor="middle">rm -rf /, exfil, keychains</text>
  </g>

  <!-- Path C: Escalation Downwards -->
  <path d="M 500 240 L 500 300" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  <polygon points="496,300 500,308 504,300" fill="#f59e0b" />
  <rect x="510" y="260" width="130" height="20" rx="4" fill="#78350f" opacity="0.6"/>
  <text x="575" y="274" font-family="sans-serif" font-size="10" font-weight="600" fill="#fcd34d" text-anchor="middle">Ambiguous / Mutation</text>

  <!-- Node 3: Stage 1 Fast Semantic SLM -->
  <g transform="translate(320, 310)">
    <rect width="360" height="85" rx="12" fill="url(#cardGrad1)" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="28" cy="24" r="8" fill="#f59e0b"/>
    <text x="46" y="28" font-family="sans-serif" font-size="14" font-weight="700" fill="#f8fafc">STAGE 1: Fast Classifier (~2.5s)</text>
    <text x="24" y="52" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Schema-enforced Gemini 3.8 Flash-Low via warm daemon</text>
    <text x="24" y="70" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Confidence: High -&gt; Final Decision | Confidence: Low -&gt; Escalate</text>
  </g>

  <!-- Path D: Stage 1 Decision -->
  <path d="M 680 340 L 780 340" fill="none" stroke="#10b981" stroke-width="2"/>
  <polygon points="780,336 788,340 780,344" fill="#10b981"/>
  
  <g transform="translate(790, 315)">
    <rect width="170" height="50" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="85" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">Stage 1 Decision</text>
    <text x="85" y="40" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Confidence: High</text>
  </g>

  <!-- Connector Down to Stage 2 -->
  <path d="M 500 395 L 500 425" fill="none" stroke="#a855f7" stroke-width="2"/>
  <polygon points="496,425 500,433 504,425" fill="#a855f7"/>

  <!-- Node 4: Stage 2 Deep Deliberative Review -->
  <g transform="translate(320, 435)">
    <rect width="360" height="65" rx="10" fill="url(#cardGrad1)" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="28" cy="22" r="7" fill="#a855f7"/>
    <text x="46" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc">STAGE 2: Deep Review Escalation</text>
    <text x="24" y="48" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Deliberative fail-closed reasoning for lateral scripts</text>
  </g>

  <!-- Path E: Stage 2 Final Fail-Closed -->
  <path d="M 680 465 L 780 465" fill="none" stroke="#a855f7" stroke-width="2"/>
  <polygon points="780,461 788,465 780,469" fill="#a855f7"/>

  <g transform="translate(790, 440)">
    <rect width="170" height="50" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
    <text x="85" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#c084fc" text-anchor="middle">Stage 2 Final Verdict</text>
    <text x="85" y="40" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Fail-Closed Guarantee</text>
  </g>
</svg>
