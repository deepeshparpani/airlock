[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airlock"
version = "1.0.0"
description = "Airlock: High-assurance, low-latency AI command security classifier for autonomous coding agents (Antigravity/AGY, Claude Code, OpenAI Operator)"
readme = "README.md"
authors = [
    { name = "Deepesh Parpani", email = "deepesh.parpani@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
]

[project.scripts]
airlock = "airlock.hook:main"
airlock-hook = "airlock.hook:main"
airlock-daemon = "airlock.daemon.server:main"
lgtm = "airlock.hook:main"
lgtm-hook = "airlock.hook:main"
lgtm-daemon = "airlock.daemon.server:main"

[tool.setuptools.packages.find]
include = ["airlock*"]
